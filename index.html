<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🎀</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffdce9;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}
</style>
</head>

<body>

<audio id="music" src="lagu.mp3" loop preload="auto"></audio>

<iframe src="home.html"></iframe>

<script>
function startMusic() {
    const music = document.getElementById("music");

    music.volume = 0.6;

    music.play().catch(function(error) {
        console.log("Music belum bisa diputar:", error);
    });
}
</script>

</body>
</html>
