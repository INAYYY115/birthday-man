<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🎀</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Playfair+Display:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffdce9;
        font-family: 'Quicksand', sans-serif;
        color: #6f4052;
    }

    .card {
        width: 88%;
        max-width: 380px;
        background: #fffafa;
        padding: 35px 25px;
        border-radius: 28px;
        text-align: center;
        box-shadow: 0 12px 30px rgba(120, 70, 90, 0.12);
    }

    .ribbon {
        font-size: 38px;
        margin-bottom: 8px;
    }

    h1 {
    margin: 5px 0 18px;
    color: #e8759f;
    font-size: 30px;
    font-family: 'Playfair Display', serif;
    }

    p {
        font-size: 15px;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    button {
        border: none;
        background: #ef91b3;
        color: white;
        padding: 12px 25px;
        border-radius: 30px;
        font-size: 15px;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.96);
    }
   .next p {
    margin-bottom: 8px;
}

.next button {
    border: none;
    background: transparent;
    font-size: 35px;
    padding: 5px;
    cursor: pointer;
    box-shadow: none;
}

    transform: scale(0.85);

<p>

</p>

<div class="next">
