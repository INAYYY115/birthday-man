<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You 🤍</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&family=Playfair+Display:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #ffdce9;
        font-family: 'Quicksand', sans-serif;
        color: #6f4052;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .card {
        width: 88%;
        max-width: 360px;
        background: #fffafa;
        padding: 30px 20px;
        border-radius: 28px;
        text-align: center;
        box-shadow: 0 12px 30px rgba(120, 70, 90, 0.12);
    }

    .ribbon {
        font-size: 32px;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0 0 18px;
        color: #e8759f;
        font-size: 27px;
        font-family: 'Playfair Display', serif;
    }

    .photo-frame {
        width: 190px;
        margin: 0 auto 18px;
        padding: 8px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 6px 15px rgba(120, 70, 90, 0.15);
    }

    .photo-frame img {
        width: 100%;
        height: 230px;
        object-fit: cover;
        display: block;
        border-radius: 7px;
    }

    .caption {
        font-family: 'Dancing Script', cursive;
        font-size: 20px;
        color: #b86b86;
        margin-bottom: 10px;
    }
</style>
</head>

<body>

<div class="card">

    <div class="ribbon">🎀</div>

    <h1>A little picture 🤍</h1>

    <div class="photo-frame">
        <img src="foto-ultah.jpg" alt="Foto">
    </div>

    <div class="caption">
        one of my favorite memories 🤍
    </div>

</div>

</body>
</html>
