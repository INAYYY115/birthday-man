<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open 🐬</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #ffdce9;
        font-family: 'Quicksand', sans-serif;
        color: #6f4052;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
    }

    .card {
        width: 88%;
        max-width: 380px;
        background: #fffafa;
        padding: 40px 25px;
        border-radius: 28px;
        text-align: center;
        box-shadow: 0 12px 30px rgba(120, 70, 90, 0.12);
    }

    .ribbon {
        font-size: 38px;
        margin-bottom: 15px;
    }

    h1 {
        margin: 0 0 18px;
        color: #e8759f;
        font-size: 30px;
        font-family: 'Playfair Display', serif;
    }

    .dolphin {
        border: none;
        background: transparent;
        font-size: 48px;
        padding: 5px;
        cursor: pointer;
        box-shadow: none;
    }

    .dolphin:active {
        transform: scale(0.85);
    }
</style>
</head>

<body>

<div class="card">

    <div class="ribbon">🎀</div>

    <h1>Open</h1>

    <button class="dolphin" onclick="nextPage()">🐬</button>

</div>

<script>
function nextPage() {
    window.location.href = "little-things.html";
}
</script>

</body>
</html>
